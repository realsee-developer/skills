name: Bug report
description: Report a reproducible problem with a skill, script, or repository workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: skill
    attributes:
      label: Skill or area
      description: Name the affected skill or repository area.
      placeholder: argus
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide sanitized commands and steps.
      placeholder: |
        1. Run `npm run test:skill`
        2. See failure ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Lifecycle command
      options:
        - Start
        - Status
        - Collect
        - Input validation
        - Output validation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS and agent host; for Argus include Node.js/npm versions and sanitized configuration names, or for local reconstruction include the Blender version.
      placeholder: |
        OS:
        Node:
        npm (Argus):
        Blender (local reconstruction):
        REALSEE_REGION:
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed secrets, generated credentials, private URLs, and account identifiers.
          required: true
